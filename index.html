<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova Command Center</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2family=Orbitron:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--animated bg-->

    <div class="background">
      <div class="stars"></div>
      <div class="glow1"></div>
      <div class="glow2"></div>
    </div>

    <nav>
      <h2>Nova Command Center</h2>

      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Dashboard</a></li>
        <li><a href="#">Settings</a></li>
      </ul>
    </nav>

    <main>
      <section class="hero">
        <h3 id="greeting">Good Evening</h3>
        <h1 id="clock">00:00:00</h1>
        <p id="date"></p>
      </section>
      <!-- glass search box-->
      <section class="glass search-box">
        <input type="text" id="search" placeholder="search Google ..." />
      </section>

      <section>
        <h2 class="section-title">Quick Links</h2>

        <div class="links">
          <!--Github-->
          <div class="card" onclick="window.open('https://github.com')">
            <div class="icon">💻</div>
            <h3>GitHub</h3>
          </div>

          <!--Gmail-->
          <div class="card" onclick="window.open('https://mail.google.com')">
            <div class="icon">📧</div>
            <h3>Gmail</h3>
          </div>
          <!--MDN Docs-->
          <div
            class="card"
            onclick="window.open('https://developer.mozilla.org')"
          >
            <div class="icon">📚</div>
            <h3>MDN Docs</h3>
          </div>
          <!--Stack overflow-->
          <div class="card" onclick="window.open('https://stackoverflow.com')">
            <div class="icon">🧠</div>
            <h3>Stack Overflow</h3>
          </div>
        </div>
      </section>

      <section class = "widgets">
        <div class="glass widgets">
            <h3>🌤 Weather</h3>
           <p>Coming in Phase 3</p> 
        </div>

        <div class="glass widget">
            <h3>🚀 NASA APOD</h3>
            <p>Coming in Phase 3</p>
        </div>
        <div class="glass widgets">
            <h3>📝 Todo List</h3>
            <p>Coming in Phase 3</p>
        </div>
      </section>
    </main>

    <footer>
      <p>
            Built by Himanshu Pratap ❤️
        </p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>

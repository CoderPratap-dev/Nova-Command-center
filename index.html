<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Command Center</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2family=Orbitron:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <h2>Nova Command Center</h2>

        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Dashboard</a></li>
            <li><a href="#">Settings</a></li>
        </ul>
    </nav>

    <main>

        <section class="hero">

            <h3 id="greeting">Good Evening</h3>
            <h1 id="clock">00:00:00</h1>
            <p id="date"></p>

        </section>

        <section class="search-box">
            <input type="text" id="search" placeholder="search Google ...">
        </section>

        <section class="links">
            <div class="card">Github</div>
            <div class="card">Gmail</div>
            <div class="card"> Docs</div>
            <div class="card">Youtube</div>
        </section>

    </main>

    <footer>
        Made With 💗 For Stardance
    </footer>

    <script src="script.js"></script>

</body>
</html>
